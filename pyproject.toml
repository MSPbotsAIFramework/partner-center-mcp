[project]
name = "partner-center-mcp"
version = "0.1.0"
description = "MCP server for Microsoft CSP / Partner Center (read-only query operations)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
partner-center-mcp = "partner_center_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partner_center_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
